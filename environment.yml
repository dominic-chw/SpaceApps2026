name: analog-finder
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - pandas
  - pyarrow
  - geopandas
  - rasterio
  - rioxarray
  - xarray
  - scikit-learn
  - xgboost
  - lightgbm
  - pyyaml
  - requests
  - pytest
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      # optional: neural-net comparison for the permafrost model (pipeline/earth_ml/permafrost_nn.py)
      - torch  # optional, CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu
