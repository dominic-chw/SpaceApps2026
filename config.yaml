matcher: knn          # knn | deep | hybrid
grid_deg: 2
lat_limit: 70
bands: [skin, upper_metre, drill_zone, deep]
top_twins_grid: 3
top_twins_showcase: 5
min_twin_spacing_km: 200
paths:
  weights: weights/default.json
  output: output
  models: models
# Match levels: lowest match_pct for each level (anything below "poor" is no_match)
levels:
  excellent: 85
  good: 70
  fair: 50
  poor: 30
