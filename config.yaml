matcher: knn          # knn | deep | hybrid
grid_deg: 2            # Mars grid
earth_grid_deg: 0.5    # Earth global grid (bare ground only); 1 if exports are too slow
lat_limit: 70
bands: [skin, upper_metre, drill_zone, deep]
top_twins_grid: 3
top_twins_showcase: 5
min_twin_spacing_km: 200
paths:
  weights: weights/default.json
  output: output
  models: models
# Match levels: lowest match_pct for each level (anything below "poor" is no_match)
levels:
  excellent: 85
  good: 70
  fair: 50
  poor: 30

# Data-processing tunables (Dominic). Ranking-only values stay at top level / weights/.
processing:
  grid_deg: 2
  lat_limit: 70
  band_depth_m:            # [top, bottom]; null = open-ended
    skin: [0, 0.10]
    upper_metre: [0.10, 1.0]
    drill_zone: [1.0, 3.0]
    deep: [3.0, null]
  heat_model:
    mars_year_days: 687
    mars_sol_hours: 24.66
    default_thermal_inertia: 250     # J m-2 K-1 s-1/2, fallback when missing
    volumetric_heat_capacity: 1000000  # J m-3 K-1
    surface: {mean_eq_k: 220, mean_pole_drop_k: 70, diurnal_amp_ref_k: 45, ti_ref: 250, annual_amp_k: 35}
  earth_heat_model:
    year_days: 365.25
    day_hours: 24
    default_thermal_inertia: 1500
    volumetric_heat_capacity: 2000000
  ground_rules:
    massive_ice_frac: 0.7
    ice_frac: 0.25
    bedrock_ti: 700
    ice_table_lat: 75            # Mars ice table reaches the surface at this |lat|
    ice_table_m_per_deg: 0.02
    earth_active_layer_m: 0.5
    hardness: {dry_regolith: 0, ice_cemented: 2, massive_ice: 2, bedrock: 3}
    bedrock_hardness: {volcanic: 3, impact_mixed: 3, sedimentary: 2, clay_sulfate: 2, icy: 2}
  synthetic: {seed: 0, earth_sample_points: 800}
  terrain_resolution_m: 500
  bare_ground_min_fraction: 0.8
  gap_model:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    cv_block_deg: 10

  # Source of each layer variable (pipeline/common/sources.py). Default: synthetic everywhere, so
  # `python -m pipeline.run_all --build` runs end to end before datasets are picked (outputs fake: true).
  # Switch one variable at a time once it is in research/datasets.csv, e.g.
  #   soil_temp: {source: ee, id: "ECMWF/ERA5_LAND/MONTHLY_AGGR", start: "2015-01-01", end: "2023-01-01",
  #               path: data/earth/ee/soil_temp.csv,
  #               outputs: {mean_temp_k: {band: skin_temperature, temporal: mean},
  #                         annual_range_k: {band: skin_temperature, temporal: range}}}
  #   lithology: {source: file, path: data/earth/glim_cells.csv, columns: {xx: glim_class}}
  #   thermal_inertia: {source: raster, path: data/mars/tes_ti/ti_day.tif, reducer: median, nodata: 0}
  # Earth cells: {source: synthetic} (regions + samples) or {source: grid} (global earth_grid_deg grid;
  # regions.geojson regions are always added with region_id as cell_id = known analog).
  # The layers already built from downloads stay usable: {source: file, path: data/<planet>/layers.parquet}.
  sources:
    mars:
      cells: {source: synthetic}
      thermal_inertia: {source: synthetic}
      ice: {source: synthetic}
      geology: {source: synthetic}
      terrain: {source: synthetic}
      water_vapour: {source: synthetic}
    earth:
      cells: {source: synthetic}
      elevation: {source: synthetic}
      terrain: {source: synthetic}
      land_cover: {source: synthetic}
      soil_temp: {source: synthetic}
      surface_temp: {source: synthetic}
      soil_properties: {source: synthetic}
      aridity: {source: synthetic}
      permafrost: {source: synthetic}
      lithology: {source: synthetic}
      bedrock: {source: synthetic}
      labels: {source: synthetic}
