name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: analog-finder
          miniforge-version: latest
      # Tests force synthetic sources (tests/conftest.py), so no downloaded data/ is needed.
      - run: pytest tests/ -q
