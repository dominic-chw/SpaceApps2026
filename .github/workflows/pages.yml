name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "output/**", "research/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}/web/
    steps:
      - uses: actions/checkout@v4

      # The app reads ../output/*.json relative to /web/, so keep the repo layout.
      - name: Build site
        run: |
          mkdir -p _site
          cp -r web output _site/
          if [ -d research ]; then cp -r research _site/; fi
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Planetary Twin</title>
          <meta http-equiv="refresh" content="0; url=web/">
          <a href="web/">Open Planetary Twin</a>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
